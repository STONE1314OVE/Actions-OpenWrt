name: Build OpenWrt for Cudy TR3000

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: '开启 SSH 远程调试 (true/false)'
        required: false
        default: 'false'

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: openwrt-25.12
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
    - name: 检出当前仓库
      uses: actions/checkout@v4

    - name: 初始化编译环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install $(curl -fsSL git.io/depends-ubuntu-2204)
        sudo -E apt-get -qq install clang llvm lld libelf-dev
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: 拉取源码
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone $REPO_URL -b$REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: 加载自定义源
      run: |
        [ -e $FEEDS_CONF ] && mv$FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: 更新 Feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: 安装 Feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: 载入配置并执行 DIY-2 修补
      run: |
        [ -e files ] && cp -r files openwrt/files
        [ -e $CONFIG_FILE ] && cp -f$CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH
        make defconfig

    # 1. 稳定版 Upterm SSH 远程调试
    - name: SSH 远程调试 (Upterm)
      uses: owenthereal/action-upterm@v1.15.0
      if: (github.event.inputs.ssh == 'true' && github.event.inputs.ssh != 'false') || contains(github.event.action, 'ssh')
      with:
        upterm-version: 'v0.29.0'
        limit-access-to-actor: true

    # 2. SSH 调试结束后自动将 menuconfig 变更推回仓库
    - name: 自动保存提取的新配置到仓库
      if: (github.event.inputs.ssh == 'true' && github.event.inputs.ssh != 'false') || contains(github.event.action, 'ssh')
      run: |
        cd openwrt
        ./scripts/diffconfig.sh > $GITHUB_WORKSPACE/.config
        cd $GITHUB_WORKSPACE
        if ! git diff --quiet .config; then
          echo "检测到配置有更新，正在推送回仓库..."
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .config
          git commit -m "Update .config via SSH Menuconfig"
          git push
        else
          echo "配置未发生变化，跳过推送。"
        fi

    - name: 预下载依赖包
      id: package
      run: |
        cd openwrt
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: 全速多线程编译
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 检查空间占用
      if: (!cancelled())
      run: df -hT

    # 3. 整理并规范化所有固件格式（同时保留 sysupgrade、initramfs 和校验文件）
    - name: 整理并规范化所有固件格式
      id: organize
      if: steps.compile.outputs.status == 'success' && !cancelled()
      run: |
        cd openwrt/bin/targets/mediatek/filogic/
        mkdir -p $GITHUB_WORKSPACE/release
        
        # 清除散装 ipk 缓存，只保留目标固件文件
        rm -rf packages
        
        DATE_STR=$(date +%Y%m%d)
        TAG_NAME="v$(date +%Y.%m.%d-%H%M)"
        
        # 遍历所有 TR3000 固件文件，按用途规范命名并归档
        for file in *cudy*tr3000*; do
          [ -f "$file" ] || continue
          
          if [[ "$file" == *"sysupgrade"* ]]; then
            EXT="${file##*.}"
            cp -f "$file" "$GITHUB_WORKSPACE/release/ImmortalWrt-24.10-Cudy-TR3000-ubootmod-sysupgrade-${DATE_STR}.${EXT}"
          elif [[ "$file" == *"initramfs"* ]]; then
            EXT="${file##*.}"
            cp -f "$file" "$GITHUB_WORKSPACE/release/ImmortalWrt-24.10-Cudy-TR3000-ubootmod-recovery-initramfs-${DATE_STR}.${EXT}"
          else
            cp -f "$file" "$GITHUB_WORKSPACE/release/"
          fi
        done
        
        # 复制 sha256 校验和 buildinfo 记录
        [ -f sha256sums ] && cp -f sha256sums "$GITHUB_WORKSPACE/release/sha256sums-${DATE_STR}.txt"
        [ -f config.buildinfo ] && cp -f config.buildinfo "$GITHUB_WORKSPACE/release/config.buildinfo"
        
        echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
        echo "release_date=$(date +'\%Y-\%m-\%d \%H:\%M')" >> $GITHUB_OUTPUT
        echo "release_dir=$GITHUB_WORKSPACE/release" >> $GITHUB_OUTPUT
        
        echo "=== 即将发布到 Release 的完整固件列表 ==="
        ls -lh $GITHUB_WORKSPACE/release/

    # 4. 全量发布至 GitHub Releases
    - name: 发布至 GitHub Releases
      uses: softprops/action-gh-release@v2
      if: steps.compile.outputs.status == 'success' && !cancelled()
      with:
        tag_name: ${{ steps.organize.outputs.tag_name }}
        name: Cudy TR3000 (ubootmod) ImmortalWrt 25.12 daede 双内核固件
        body: |
          ### 固件下载与刷机指南
          * **适配机型**: Cudy TR3000 v1 (MediaTek MT7981B)
          * **分区架构**: ubootmod 大分区架构
          * **文件选刷说明**:
            * **`*sysupgrade.bin` (推荐日常刷入)**: 完整 SquashFS 正式固件，支持保存配置。直接在 U-Boot Web 刷机后台或现有系统后台上传刷入即可。
            * **`*recovery-initramfs.itb`**: 内存应急固件，仅在救砖或临时测试时在 U-Boot 中加载。
            * **`sha256sums-*.txt`**: 文件哈希校验值。
          * **内核特性**: Linux 6.6、Netkit 点火、TCP BBR、原生 eBPF/BTF
          * **构建时间**: ${{ steps.organize.outputs.release_date }}
        files: ${{ steps.organize.outputs.release_dir }}/*
