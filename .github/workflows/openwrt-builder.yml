name: Build OpenWrt for Cudy TR3000

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: '开启 SSH 远程调试 (true/false)'
        required: false
        default: 'false'

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: openwrt-24.10
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
    - name: 检出当前仓库
      uses: actions/checkout@v4

    - name: 初始化编译环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install $(curl -fsSL git.io/depends-ubuntu-2204)
        sudo -E apt-get -qq install clang llvm lld libelf-dev
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: 拉取源码
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone $REPO_URL -b$REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: 加载自定义源
      run: |
        [ -e $FEEDS_CONF ] && mv$FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: 更新 Feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: 安装 Feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: 载入配置并执行 DIY-2 修补
      run: |
        [ -e files ] && cp -r files openwrt/files
        [ -e $CONFIG_FILE ] && cp -f $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH
        make defconfig

    # 1. 稳定版 Upterm SSH 远程调试
    - name: SSH 远程调试 (Upterm)
      uses: owenthereal/action-upterm@v1.15.0
      if: (github.event.inputs.ssh == 'true' && github.event.inputs.ssh != 'false') || contains(github.event.action, 'ssh')
      with:
        upterm-version: 'v0.29.0'
        limit-access-to-actor: true

    # 2. SSH 调试结束后自动将 menuconfig 变更推回仓库
    - name: 自动保存提取的新配置到仓库
      if: (github.event.inputs.ssh == 'true' && github.event.inputs.ssh != 'false') || contains(github.event.action, 'ssh')
      run: |
        cd openwrt
        ./scripts/diffconfig.sh > $GITHUB_WORKSPACE/.config
        cd $GITHUB_WORKSPACE
        if ! git diff --quiet .config; then
          echo "检测到配置有更新，正在推送回仓库..."
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .config
          git commit -m "Update .config via SSH Menuconfig"
          git push
        else
          echo "配置未发生变化，跳过推送。"
        fi

    - name: 预下载依赖包
      id: package
      run: |
        cd openwrt
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: 全速多线程编译
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 检查空间占用
      if: (!cancelled())
      run: df -hT

    # 3. 规范化文件名与标签提取
    - name: 提取并规范化固件文件名
      id: organize
      if: steps.compile.outputs.status == 'success' && !cancelled()
      run: |
        cd openwrt/bin/targets/mediatek/filogic/
        
        # 优先捕获 ubootmod 架构下的 itb 固件
        FIRMWARE=$(ls *cudy*tr3000*ubootmod*.itb 2>/dev/null | head -n 1)
        [ -z "$FIRMWARE" ] && FIRMWARE=$(ls *cudy*tr3000*ubootmod*sysupgrade.bin 2>/dev/null | head -n 1)
        [ -z "$FIRMWARE" ] && FIRMWARE=$(ls *sysupgrade.* 2>/dev/null | head -n 1)
        
        EXT="${FIRMWARE##*.}"
        export TZ='Asia/Shanghai'
        
        # 规范 Release 标签与固件名称
        TAG_NAME="v$(date +%Y.%m.%d-%H%M)"
        FILE_NAME="ImmortalWrt-24.10-Cudy-TR3000-ubootmod-daede-$(date +\%Y\%m\%d).${EXT}"
        
        mv "$FIRMWARE" "$FILE_NAME"
        
        echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
        echo "firmware_path=openwrt/bin/targets/mediatek/filogic/${FILE_NAME}" >> $GITHUB_OUTPUT
        echo "release_date=$(date +'\%Y-\%m-\%d \%H:\%M')" >> $GITHUB_OUTPUT

    # 4. 发布至 GitHub Releases
    - name: 发布至 GitHub Releases
      uses: softprops/action-gh-release@v2
      if: steps.compile.outputs.status == 'success' && !cancelled()
      with:
        tag_name: ${{ steps.organize.outputs.tag_name }}
        name: Cudy TR3000 (ubootmod) ImmortalWrt 24.10 daede 双内核固件
        body: |
          ### 固件发布说明
          * **适配设备**: Cudy TR3000 v1 (MediaTek Filogic 830 / MT7981B)
          * **分区架构**: ubootmod 大分区 (请在 U-Boot Web 控制台刷入)
          * **系统源码**: ImmortalWrt 24.10 (Linux 6.6 内核)
          * **核心组件**: 原生 daede 双核心 (dae + daed) 与 Aurora 主题
          * **默认管理 IP**: `192.168.1.1`
          * **构建时间**: ${{ steps.organize.outputs.release_date }}
        files: ${{ steps.organize.outputs.firmware_path }}
